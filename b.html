const bb=document.querySelector('.bb');
document.querySelector('.fl').addEventListener('click',ev=>{const b=ev.target.closest('[data-f]');if(!b)return;document.querySelectorAll('.fl button').forEach(x=>x.setAttribute('aria-pressed',x===b));bb.querySelectorAll('.bc').forEach(c=>c.hidden=!(b.dataset.f==='all'||c.dataset.cat===b.dataset.f))});
const links=[...document.querySelectorAll('.nav a, .idx a')];
const io=new IntersectionObserver(es=>es.forEach(en=>{if(en.isIntersecting)links.forEach(a=>a.classList.toggle('on',a.getAttribute('href')==='#'+en.target.id))}),{rootMargin:'-45% 0px -50% 0px'});

})();
