<section class="cover" aria-label="Menna El Sonny">
  <div class="shot" id="shot">${HERO.map((n,i)=>pic(n,'Menna El Sonny, portrait '+(i+1),i<2)).join('')}
    <div class="issue" role="group" aria-label="Choose cover photo">${HERO.map((n,i)=>`<button type="button" aria-label="Photo ${i+1}" aria-current="${i?'false':'true'}" data-c="${i}"></button>`).join('')}</div>
    <span class="tag">Cairo</span></div>
  <div class="lines">
    <div><span class="cap" style="color:var(--rouge)">Lifestyle &amp; skincare creator · since 2018</span>
      <h1 class="mast">Menna<em>el Sonny</em></h1>
      <p class="lead">Eight years of posting, ${P.brands} brand partners, and ten million people who followed her from Cairo outfit photos to motherhood.</p></div>
    <div class="cl">
      <a href="https://www.instagram.com/menna_el_sonny/" target="_blank" rel="noopener"><b>${P.ig.replace('M','')}<i>M</i></b><span>on Instagram</span></a>
      <a href="https://www.tiktok.com/@mennaelsonny5" target="_blank" rel="noopener"><b>${P.tt.replace('M','')}<i>M</i></b><span>on TikTok · ${P.ttLikes} likes</span></a>
      <a href="#brands"><b>${P.brands}</b><span>brands · ${P.returning} came back</span></a>
      <a href="#tv"><b>TV</b><span>Sundae, Ramadan 2026</span></a>
    </div>
  </div>
</section>
<div class="tick" aria-label="Brands she has worked with"><div class="rail">${rail}${rail}</div></div>

<section class="sec w" id="story">
  <div class="sh"><div><span class="cap">The story</span><h2>Eight years, <i>one</i> voice</h2></div><p>She did not appear with one viral video. Her first post is from August 2018; the brands, the wedding, Laila and the TV commercial came one year at a time.</p></div>
  <div class="story">
    <div class="ph">${pic('st-navy2','Menna El Sonny in navy satin')}</div>
    <div>
      <ol class="tl">${MP.TIMELINE.map(t=>`<li><b>${t.y}</b><div><h3>${e(t.t)}</h3><p>${e(t.d)}</p></div></li>`).join('')}</ol>
      <div class="proof"><div><b>${P.posts}</b><span>Instagram posts since 2018</span></div><div><b>${P.likes}</b><span>likes on Instagram alone</span></div><div><b>${P.comments}</b><span>comments, real conversations</span></div><div><b>${P.returning}/${P.brands}</b><span>brands that booked her again</span></div></div>
    </div>
  </div>
</section>

<section class="sec w" id="brands">
  <div class="sh"><div><span class="cap">The brand book</span><h2>Her face, <i>their</i> name</h2></div><p>${B.length} brands from DeFacto to Gulf Air, each on her own cover. Counted from her Instagram since 2019. Tap any brand for the campaign.</p></div>
  <div class="fl" role="toolbar" aria-label="Filter brands">${MB.CATS.map((c,i)=>`<button type="button" data-f="${c[0]}" aria-pressed="${i?'false':'true'}">${c[1]}<span>${cnt(c[0])}</span></button>`).join('')}</div>
  <div class="bb">${B.map(card).join('')}</div>
  <p class="note">Trendyol, inDrive, Air Arabia and Yango Play ran on TikTok and in stories.</p>
</section>

<section class="sec w" id="watched">
  <div class="sh"><div><span class="cap">Most watched</span><h2>The <i>millions</i></h2></div><p>Her biggest videos across Instagram and TikTok, ranked by views. The top one passed ${P.topIG}; all eight together pass 110 million.</p></div>
  <div class="mw">${MP.TOP.map((x,i)=>`<a href="${x.url}" target="_blank" rel="noopener" aria-label="${e(x.t)}, ${x.v} million views on ${x.p}">${pic(x.img,x.t)}<span class="rk">${String(i+1).padStart(2,'0')}</span><span class="pf">${x.p}</span><span class="tx"><b>${x.v}<i>M VIEWS</i></b><span>${e(x.t)}</span><small>${e(x.sub)} · ${x.l} likes · ${x.y}</small></span></a>`).join('')}</div>
</section>

<section class="tv" id="tv"><div class="w">
  <div class="sh"><div><span class="cap">On TV</span><h2>Sundae, <i>Ramadan</i></h2></div><p>Ramadan 2026: Menna joins the cast of the Sundae ice cream commercial, on air through the season and posted as a collab reel.</p></div>
  <a class="tvf" href="https://www.instagram.com/reel/DU_ZR_FAMhs/" target="_blank" rel="noopener" aria-label="Watch the Sundae Ramadan commercial">${pic('b-sundae-tv','A frame from the Sundae Ramadan TV commercial')}<span class="play"></span><span class="c2"><span>Sundae Ice Cream · TV commercial</span><span>Watch the reel ↗</span></span></a>
</div></section>

<section class="sec" id="worlds"><div class="w">
  <div class="sh"><div><span class="cap">Her worlds</span><h2>Four <i>chapters</i></h2></div><p>Beauty, fashion, travel and family. Every photo here is from the last two years. Tap one to see it large.</p></div>
  <div class="wt" role="tablist" aria-label="Worlds">${MP.WORLDS.map((w,i)=>`<button role="tab" aria-selected="${i?'false':'true'}" data-w="${w.id}">${e(w.t)}</button>`).join('')}</div></div>
  <div class="k-car"><div class="k-track" id="wrow"></div><div class="w wd"><p id="wdesc"></p><div class="arr"><button data-dir="-1" aria-label="Previous">←</button><button data-dir="1" aria-label="Next">→</button></div></div></div>
</section>

<section class="sec w" id="services">
  <div class="sh"><div><span class="cap">Work with Menna</span><h2>What she <i>makes</i></h2></div><p>Twelve formats across TikTok and Instagram, from one video to a season as your face.</p></div>
  <div class="sv">${D.SERV.map(s=>`<div><h3>${e(s.t)}</h3><p>${e(s.d)}</p><small><b>${e(s.proof)}</b> ${e(s.pl)}</small></div>`).join('')}</div>
</section>

<section class="sec w" id="contact">
  <div class="ct">
    <div><span class="cap" style="color:var(--rouge)">Business inquiries</span><h2>Book <i>Menna</i></h2></div>
    <div><p style="margin:0 0 12px;color:var(--ink2)">Write with your brand, the idea and your dates.</p>
      <div class="mail"><span>${D.EMAIL}</span><button type="button" data-copy="${D.EMAIL}">Copy email</button></div>
      <div class="soc"><a href="https://www.instagram.com/menna_el_sonny/" target="_blank" rel="noopener"><b>${P.ig}</b><span>Instagram</span></a><a href="https://www.tiktok.com/@mennaelsonny5" target="_blank" rel="noopener"><b>${P.tt}</b><span>TikTok</span></a><a href="https://www.facebook.com/MennaElsonnyOfficial" target="_blank" rel="noopener"><b>${P.fb}</b><span>Facebook</span></a></div>
    </div>
  </div>
</section>`;

const shot=document.getElementById('shot'),ims=[...shot.querySelectorAll('img')],dots=[...shot.querySelectorAll('[data-c]')];let cur=0,tm;
function show(i){cur=(i+ims.length)%ims.length;ims.forEach((im,k)=>{im.classList.toggle('on',k===cur);if(k===(cur+1)%ims.length)im.loading='eager'});dots.forEach((d,k)=>d.setAttribute('aria-current',k===cur))}
function auto(){clearInterval(tm);if(!matchMedia('(prefers-reduced-motion: reduce)').matches)tm=setInterval(()=>show(cur+1),5200)}
dots.forEach(d=>d.addEventListener('click',()=>{show(+d.dataset.c);auto()}));show(0);auto();
const bb=document.querySelector('.bb');
document.querySelector('.fl').addEventListener('click',ev=>{const b=ev.target.closest('[data-f]');if(!b)return;document.querySelectorAll('.fl button').forEach(x=>x.setAttribute('aria-pressed',x===b));bb.querySelectorAll('.bc').forEach(c=>c.hidden=!(b.dataset.f==='all'||c.dataset.cat===b.dataset.f))});
const wrow=document.getElementById('wrow'),wdesc=document.getElementById('wdesc');
function setW(id){const w=MP.WORLDS.find(x=>x.id===id);wrow.innerHTML=w.imgs.map((n,i)=>`<button type="button" data-lb="w-${id}" data-i="${i}" aria-label="Open photo ${i+1}">${pic(n,w.t)}</button>`).join('');wrow.scrollLeft=0;wdesc.textContent=w.d+' '+w.imgs.length+' photos.';document.querySelectorAll('.wt button').forEach(b=>b.setAttribute('aria-selected',b.dataset.w===id))}
document.querySelector('.wt').addEventListener('click',ev=>{const b=ev.target.closest('[data-w]');if(b)setW(b.dataset.w)});setW('studio');
const links=[...document.querySelectorAll('.nav a')];
const io=new IntersectionObserver(es=>es.forEach(en=>{if(en.isIntersecting)links.forEach(a=>a.classList.toggle('on',a.getAttribute('href')==='#'+en.target.id))}),{rootMargin:'-45% 0px -50% 0px'});
['story','brands','watched','tv','worlds','services','contact'].forEach(id=>{const el=document.getElementById(id);if(el)io.observe(el)});
})();
</script>
</body>
</html>
